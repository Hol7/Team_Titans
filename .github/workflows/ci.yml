name: Bootstrap CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.3
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run migrations and tests
        run: |
          cd backend
          python manage.py migrate
          python manage.py test

      - name: Build backend Docker images
        run: |
          docker build -t backend-dev -f backend/Dockerfile.dev ./backend
          docker build -t backend-prod -f backend/Dockerfile.prod ./backend

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and test frontend
        run: |
          cd frontend
          npm ci
          npm test

      - name: Build frontend Docker images
        run: |
          docker build -t frontend-dev -f frontend/Dockerfile.dev ./frontend
          docker build -t frontend-prod -f frontend/Dockerfile.prod ./frontend
