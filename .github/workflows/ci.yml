name: CI Pipeline - Team Titans

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.3
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations & tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: bootstrap
        run: |
          cd backend
          python manage.py migrate --noinput
          python manage.py test --verbosity=2

      - name: Build backend Docker images
        run: |
          docker build -t teamtitans-backend-dev -f backend/Dockerfile.dev ./backend
          docker build -t teamtitans-backend-prod -f backend/Dockerfile.prod ./backend

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run tests
        run: |
          cd frontend
          npm run test --if-present

      - name: Build frontend Docker images
        run: |
          docker build -t teamtitans-frontend-dev -f frontend/Dockerfile.dev ./frontend
          docker build -t teamtitans-frontend-prod -f frontend/Dockerfile.prod ./frontend
