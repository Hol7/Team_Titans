name: Security Scans - TMTT

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  # ==========================================
  # 0. Setup - Installation unique des outils
  # ==========================================
  setup-tools:
    name: Setup Security Tools
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install uv and all security tools
        run: |
          pip install uv
          uv pip install --system bandit[toml] safety
      
      restore-keys: |
            ${{ runner.os }}-python-3.11-
  
  # ==========================================
  # 1. Snyk - Scan des dépendances
  # ==========================================
  snyk-dependencies:
    name: Snyk Dependency Scan
    needs: setup-tools
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /opt/hostedtoolcache/Python
          key: ${{ runner.os }}-python-3.11-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.11-
      
      - name: Cache Python environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /opt/hostedtoolcache/Python
          key: ${{ runner.os }}-python-3.11-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.11-
      
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend/requirements.txt
      
      - name: Upload Snyk report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: snyk-*.json

  # ==========================================
  # 2. Bandit - Analyse statique du code Python
  # ==========================================
  bandit-code-scan:
    name: Bandit Security Linter
    needs: setup-tools
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /opt/hostedtoolcache/Python
          key: ${{ runner.os }}-python-3.11-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.11-
      
      - name: Install bandit
        run: uv pip install --system bandit[toml]
      
      - name: Run Bandit scan
        run: |
          cd backend
          bandit -r app/ backend/ -f json -o bandit-report.json || true
          bandit -r app/ backend/ -f txt
        continue-on-error: true
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json

  # ==========================================
  # 3. Safety - Scan des vulnérabilités connues
  # ==========================================
  safety-scan:
    name: Safety Vulnerability Check
    needs: setup-tools
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /opt/hostedtoolcache/Python
          key: ${{ runner.os }}-python-3.11-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.11-
      
      - name: Install safety
        run: uv pip install --system safety
      
      - name: Run Safety check
        run: |
          cd backend
          safety check --json > safety-report.json || true
          safety check
        continue-on-error: true
      
      - name: Upload Safety report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: backend/safety-report.json

  # ==========================================
  # 4. Trivy - Scan des images Docker
  # ==========================================
  trivy-docker-scan:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          cd backend
          docker build -f Dockerfile.prod -t tmtt-backend:latest .
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tmtt-backend:latest'
          format: 'json'
          output: 'trivy-report.json'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      
      - name: Run Trivy scanner (table format)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tmtt-backend:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true
      
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

  # ==========================================
  # 5. OWASP ZAP - Tests de sécurité dynamiques
  # ==========================================
  owasp-zap-scan:
    name: OWASP ZAP Security Scan
    needs: setup-tools
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tmtt_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Restore cached dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            /opt/hostedtoolcache/Python
          key: ${{ runner.os }}-python-3.11-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.11-
      
      - name: Install dependencies
        run: |
          pip install uv
          cd backend
          uv pip install --system -r requirements.txt
      
      - name: Setup test environment
        run: |
          cd backend
          cp .env.example .env || true
          python manage.py migrate
          python manage.py runserver &
          sleep 10
      
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8000/api/v1/'
          rules_file_name: 'backend/zap-config.yaml'
          cmd_options: '-a'
        continue-on-error: true
      
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            zap-reports/
            report_html.html
            report_json.json
            report_md.md

  # ==========================================
  # 6. Consolidated Security Report
  # ==========================================
  security-summary:
    name: Security Summary
    needs: [snyk-dependencies, bandit-code-scan, safety-scan, trivy-docker-scan, owasp-zap-scan]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create security summary
        run: |
          echo "# 🔐 Security Scan Summary - TMTT" > security-summary.md
          echo "" >> security-summary.md
          echo "**Date:** $(date)" >> security-summary.md
          echo "" >> security-summary.md
          
          echo "## 📊 Scan Results" >> security-summary.md
          echo "" >> security-summary.md
          
          echo "### Snyk - Dependencies" >> security-summary.md
          if [ -f snyk-report/*.json ]; then
            echo "✅ Report generated" >> security-summary.md
          else
            echo "❌ No report found" >> security-summary.md
          fi
          echo "" >> security-summary.md
          
          echo "### Bandit - Code Analysis" >> security-summary.md
          if [ -f bandit-report/*.json ]; then
            echo "✅ Report generated" >> security-summary.md
          else
            echo "❌ No report found" >> security-summary.md
          fi
          echo "" >> security-summary.md
          
          echo "### Safety - Vulnerability Check" >> security-summary.md
          if [ -f safety-report/*.json ]; then
            echo "✅ Report generated" >> security-summary.md
          else
            echo "❌ No report found" >> security-summary.md
          fi
          echo "" >> security-summary.md
          
          echo "### Trivy - Docker Scan" >> security-summary.md
          if [ -f trivy-report/*.json ]; then
            echo "✅ Report generated" >> security-summary.md
          else
            echo "❌ No report found" >> security-summary.md
          fi
          echo "" >> security-summary.md
          
          echo "### OWASP ZAP - Dynamic Scan" >> security-summary.md
          if [ -f zap-report/*.html ]; then
            echo "✅ Report generated" >> security-summary.md
          else
            echo "❌ No report found" >> security-summary.md
          fi
          echo "" >> security-summary.md
          
          echo "## 📝 Recommendations" >> security-summary.md
          echo "" >> security-summary.md
          echo "1. Review all HIGH and CRITICAL vulnerabilities" >> security-summary.md
          echo "2. Update dependencies with known vulnerabilities" >> security-summary.md
          echo "3. Fix code issues identified by Bandit" >> security-summary.md
          echo "4. Address OWASP ZAP findings" >> security-summary.md
          echo "5. Rebuild Docker images after fixes" >> security-summary.md
      
      - name: Upload security summary
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: security-summary.md
      
      - name: Comment PR with summary (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('security-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

  # ==========================================
  # 7. Bloquer le déploiement si vulnérabilités critiques
  # ==========================================
  deployment-gate:
    name: Deployment Security Gate
    needs: [snyk-dependencies, bandit-code-scan, safety-scan, trivy-docker-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Check for critical vulnerabilities
        run: |
          echo "🔍 Checking for critical vulnerabilities..."
          
          CRITICAL_FOUND=false
          
          # Check Snyk report
          if [ -f snyk-report/*.json ]; then
            if grep -q '"severity":"critical"' snyk-report/*.json; then
              echo "❌ CRITICAL vulnerabilities found in dependencies (Snyk)"
              CRITICAL_FOUND=true
            fi
          fi
          
          # Check Trivy report
          if [ -f trivy-report/*.json ]; then
            if grep -q '"Severity":"CRITICAL"' trivy-report/*.json; then
              echo "❌ CRITICAL vulnerabilities found in Docker image (Trivy)"
              CRITICAL_FOUND=true
            fi
          fi
          
          if [ "$CRITICAL_FOUND" = true ]; then
            echo "🚫 DEPLOYMENT BLOCKED: Critical vulnerabilities detected!"
            echo "Please fix all critical vulnerabilities before deploying."
            exit 1
          else
            echo "✅ No critical vulnerabilities found. Deployment can proceed."
          fi
